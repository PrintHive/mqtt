name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bun:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # `bun add` rewrites a peer-only dependency to an exact version, which locks out every other Effect release.
      - name: Check the effect peer is a range
        run: node -e "const v = require('./package.json').peerDependencies.effect; if (!v.startsWith('^')) { console.error('peerDependencies.effect must be a ^ range, got ' + v); process.exit(1) }"
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test
      - run: bun run build

  node:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    strategy:
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - run: bun install --frozen-lockfile
      - run: npx vitest run
      - run: bun run build
      - name: Import the built package
        run: node -e "import('./dist/index.js').then((m) => { if (typeof m.connect !== 'function') process.exit(1) })"

  # Proofs in src/*.verify.dfy, listed in LemmaScript-files.txt. See .agents/skills/verify-varint/SKILL.md.
  proofs:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    env:
      DAFNY_VERSION: 4.11.0
      DAFNY_SHA256: a46a9ff7cdd720f7955854c78e95df13f4cfe6b80691b05f8654fe19e8267179
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Install Dafny
        run: |
          curl -fsSL -o dafny.zip "https://github.com/dafny-lang/dafny/releases/download/v${DAFNY_VERSION}/dafny-${DAFNY_VERSION}-x64-ubuntu-22.04.zip"
          echo "${DAFNY_SHA256}  dafny.zip" | sha256sum -c -
          unzip -q dafny.zip -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/dafny" >> "$GITHUB_PATH"
      - run: dafny --version
      # Regenerates each .dfy.gen from its .verify.ts, checks the proof .dfy only adds to it, and verifies.
      - run: bunx lsc check --backend=dafny
      - name: Check the committed generated Dafny is current
        run: git diff --exit-code -- '*.dfy.gen'

  # TLA+ model of QoS 2 across dropped connections. See .agents/skills/verify-session-qos2/SKILL.md.
  models:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    env:
      TLA2TOOLS_SHA256: 936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - name: Install TLC
        run: |
          curl -fsSL -o "$RUNNER_TEMP/tla2tools.jar" https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          echo "${TLA2TOOLS_SHA256}  $RUNNER_TEMP/tla2tools.jar" | sha256sum -c -
          echo "TLA2TOOLS=$RUNNER_TEMP/tla2tools.jar" >> "$GITHUB_ENV"
      - run: bun .agents/skills/verify-session-qos2/scripts/check.ts check
      - run: bun .agents/skills/verify-session-qos2/scripts/check.ts mutants
